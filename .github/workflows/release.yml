name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write # npm trusted publishing (OIDC)
      contents: write # GitHub release creation

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify release tag
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("package.json", "utf8"));
            if (process.env.GITHUB_REF_NAME !== `v${version}`) {
              throw new Error("Release tag must match package.json version");
            }
          '

      - name: Install dependencies
        run: npm ci

      - name: Check code
        run: |
          npm run typecheck
          npm run lint
          npm run format:check

      - name: Build and test
        run: npm test

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Publish to npm with OIDC
        env:
          NPM_DIST_TAG: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
        run: npm publish --access public --tag "$NPM_DIST_TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
